name: client-patch-watch

# When Grinding Gear Games ships a new client, resolve the native control bridge's client signatures
# (scripts/dev/client-signatures.json) in the new PathOfExile.exe and open a pull request that adds the new build.
#
# Opt-in and self-contained: the schedule does nothing unless the repository variable CLIENT_PATCH_WATCH is "true"
# (a manual run always works), and the repository must allow GitHub Actions to create pull requests
# (Settings > Actions > General). Two jobs keep it cheap:
#   poll     every 30 minutes: no checkout and no setup actions; fetches two small files through the API, asks GGG's
#            patch server for the current version (one TCP round trip) and compares it with the known builds.
#            A few seconds. A version that already has a pull request (open, merged or closed) is left alone, and
#            after a failed run nothing is retried for 6 hours (a manual run with `force` overrides both).
#   resolve  only for such a new version: downloads PathOfExile.exe to the runner's temporary directory (never
#            committed or uploaded; deleted afterwards), checks it is signed by Grinding Gear Games (fail closed),
#            resolves the signatures, runs the checks and opens or updates the pull request. CI cannot run the
#            game, so the pull request asks a person for the live checklist.

on:
  push:  # TEST ONLY (fork): run on this branch
    branches: [ci-test/control-signatures]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Resolve and open/update the pull request even if the version is known or recently failed
        type: boolean
        default: false

concurrency:
  group: client-patch-watch
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name != 'schedule' || vars.CLIENT_PATCH_WATCH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.poll.outputs.run }}
      version: ${{ steps.poll.outputs.version }}
      exe_url: ${{ steps.poll.outputs.exe_url }}
    steps:
      - name: Compare the current client version with the known builds
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          call() { curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          get() { call -H "Accept: application/vnd.github.raw" "$api/contents/$1?ref=$GITHUB_SHA" -o "$RUNNER_TEMP/${1##*/}"; }
          get scripts/ci/patch_version.py & get scripts/dev/client-signatures.json & wait
          # patch_version.py validates the patch server's answer and builds exe_url from the version alone.
          python3 -I "$RUNNER_TEMP/patch_version.py" > "$RUNNER_TEMP/patch.txt"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/patch.txt")
          exe_url=$(sed -n 's/^exe_url=//p' "$RUNNER_TEMP/patch.txt")
          [[ "$version" =~ ^[0-9]{1,4}(\.[0-9]{1,4}){2,3}$ ]] || { echo "unexpected version"; exit 1; }
          [ "$exe_url" = "https://patch.poecdn.com/$version/PathOfExile.exe" ] || { echo "unexpected exe_url"; exit 1; }
          python3 -I -c 'import json, sys; print("\n".join(b["version"] for b in json.load(open(sys.argv[1]))["builds"].values()))' \
            "$RUNNER_TEMP/client-signatures.json" > "$RUNNER_TEMP/known.txt"
          run=false why="known build"
          if [ "$FORCE" = true ]; then
            run=true why="forced"
          elif ! grep -qxF "$version" "$RUNNER_TEMP/known.txt"; then
            # One pull request per version, in any state: a failed push or pull request is retried, a closed
            # one is not reopened.
            prs=$(call "$api/pulls?head=${GITHUB_REPOSITORY_OWNER}:client-patch-t2/$version&state=all&per_page=1" | python3 -I -c 'import json, sys; print(len(json.load(sys.stdin)))')
            since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            failed=$(call "$api/actions/workflows/client-patch-watch.yml/runs?status=failure&created=%3E%3D$since&per_page=1" | python3 -I -c 'import json, sys; print(json.load(sys.stdin)["total_count"])')
            if [ "$prs" != 0 ]; then why="a pull request for $version exists"
            elif [ "$failed" != 0 ]; then why="a run failed in the last 6 hours; retrying later"
            else run=true why="new version"; fi
          fi
          { echo "run=$run"; echo "version=$version"; echo "exe_url=$exe_url"; } >> "$GITHUB_OUTPUT"
          echo "current $version; known: $(paste -sd, "$RUNNER_TEMP/known.txt"); resolve: $run ($why)"

  resolve:
    needs: poll
    if: needs.poll.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.poll.outputs.version }}
      URL: ${{ needs.poll.outputs.exe_url }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]{1,4}(\.[0-9]{1,4}){2,3}$ ]] || { echo "unexpected version"; exit 1; }
          [ "$URL" = "https://patch.poecdn.com/$VERSION/PathOfExile.exe" ] || { echo "unexpected exe_url"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download PathOfExile.exe (runner temp only)
        run: |
          mkdir -p "$RUNNER_TEMP/client"
          curl -fsS --retry 3 --max-time 600 --max-filesize 400000000 -o "$RUNNER_TEMP/client/PathOfExile.exe" \
            -w 'downloaded %{size_download} bytes in %{time_total} s\n' "$URL"

      - name: Verify the Authenticode signature (Grinding Gear Games, fail closed)
        run: |
          EXE="$RUNNER_TEMP/client/PathOfExile.exe"
          # osslsigncode is not preinstalled. Unpack its package instead of installing it (no dpkg triggers);
          # its libraries (OpenSSL, curl) are on the runner.
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          apt-get download -qq osslsigncode 2>/dev/null || { sudo apt-get update -qq && apt-get download -qq osslsigncode; }
          dpkg-deb -x osslsigncode_*.deb root
          set +e
          root/usr/bin/osslsigncode verify -in "$EXE" -CAfile /etc/ssl/certs/ca-certificates.crt \
            -TSA-CAfile /etc/ssl/certs/ca-certificates.crt > "$RUNNER_TEMP/signature.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/signature.txt"
          [ "$status" -eq 0 ]
          grep -q '^Signature verification: ok' "$RUNNER_TEMP/signature.txt"
          # The signer itself (not just any certificate in the bag) must be Grinding Gear Games.
          awk '/^Signer.s certificate:/ { found = 1 } found && /Subject:/ { print; exit }' "$RUNNER_TEMP/signature.txt" \
            | grep -Eq '(^|[ ,/])O=Grinding Gear Games Limited(,|/|$)'

      - name: Resolve the signatures and add the build
        id: resolve
        run: |
          set +e
          /usr/bin/time -f 'resolver: %e s, peak RSS %M KB' python3 -I scripts/ci/resolve_client.py \
            "$RUNNER_TEMP/client/PathOfExile.exe" --write --version "$VERSION" --report "$RUNNER_TEMP/report.md" > /dev/null
          status=$?
          set -e
          # resolve_client.py: 0 already listed, 10 added with everything resolved, 20 added with something
          # unresolved; anything else (1 = an exception, 2 = usage) is an error.
          case $status in
            0|10) echo "unresolved=false" >> "$GITHUB_OUTPUT" ;;
            20) echo "unresolved=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "resolve_client.py failed with exit status $status"; exit 1 ;;
          esac
          cat "$RUNNER_TEMP/report.md"

      - name: Checks
        env:
          # With everything resolved, also replay the simulated-patch tests on the new client.
          LOCALEXILE_CLIENT_EXE: ${{ steps.resolve.outputs.unresolved == 'false' && format('{0}/client/PathOfExile.exe', runner.temp) || '' }}
        run: |
          python3 -I -m unittest discover -s scripts/ci -p 'test_*.py'
          node --check scripts/dev/client-resolver.js
          node --check scripts/dev/client-control.js

      - name: Remove the client
        if: always()
        run: rm -rf "$RUNNER_TEMP/client"

      - name: Pull request text
        env:
          UNRESOLVED: ${{ steps.resolve.outputs.unresolved }}
        run: |
          {
            echo "## Summary"
            echo
            echo "Grinding Gear Games released client $VERSION. This pull request adds its build to"
            echo "\`scripts/dev/client-signatures.json\`: the addresses and offsets of the native control bridge, found in"
            echo "the new, Grinding Gear Games-signed PathOfExile.exe. The builds already listed stay as they are."
            echo
            if [ "$UNRESOLVED" = true ]; then
              echo "**Some symbols could not be resolved** (draft, label \`needs-live-check\`): the operations that need"
              echo "them fail with \"Unsupported client: ... (not found)\" until their signatures are updated"
              echo "(Agents/docs/dev/client-control.md, \"Adding or fixing a symbol\")."
            else
              echo "Every symbol was found by its signature or a cross-reference."
            fi
            echo
            echo "**CI cannot run the game.** Before merging, someone with the new client must check it live:"
            echo
            echo "1. \`scripts/dev/client_control.py bridge:doctor\`, and again with \`--force-scan\`: every symbol"
            echo "   resolved, every operation \`ok\`, the sanity checks in range."
            echo "2. The client_control flow: game:open, login, character:list, character:play, game:status,"
            echo "   game:resources, command \`/pos\`, chat, tp, flask:use 1, character:select, logout."
            echo
            echo "A new client can also need server or protocol changes; this pull request only covers the bridge."
            echo
            echo "## Resolver report"
            echo
            cat "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/body.md"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: client-patch-t2/${{ env.VERSION }}
          base: ${{ github.ref_name }}
          add-paths: scripts/dev/client-signatures.json
          commit-message: |
            Add client build ${{ env.VERSION }} to the control bridge signatures

            Generated by .github/workflows/client-patch-watch.yml (scripts/ci/resolve_client.py).
          title: "Client ${{ env.VERSION }}: control bridge signatures for the new build"
          body-path: ${{ runner.temp }}/body.md
          draft: ${{ steps.resolve.outputs.unresolved == 'true' }}
          labels: ${{ steps.resolve.outputs.unresolved == 'true' && 'needs-live-check' || '' }}
